name: Refresh profile

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_profile_stats.py
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  stats:
    name: Regenerate stat cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render stat cards from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_stats.py

      - name: Commit when the numbers moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The footer carries a date, so only commit when something other
          # than that timestamp actually changed.
          if git diff --quiet -- assets/stats-dark.svg assets/stats-light.svg; then
            echo "No change."; exit 0
          fi
          if [ -z "$(git diff -U0 -- assets/stats-dark.svg assets/stats-light.svg \
                     | grep -E '^[+-][^+-]' | grep -v 'refreshed')" ]; then
            echo "Only the refresh date changed; skipping commit."
            git checkout -- assets/stats-dark.svg assets/stats-light.svg
            exit 0
          fi
          git add assets/stats-dark.svg assets/stats-light.svg
          git commit -m "chore: refresh profile stat cards"
          git push

  snake:
    name: Regenerate contribution snake
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
