<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="10" viewBox="0 0 1000 10" fill="none" role="presentation">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset=".25" stop-color="#14B8A6" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#0EA5E9" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="p">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect y="4.5" width="1000" height="1.2" fill="url(#l)"/>
  <circle cy="5" r="5" fill="url(#p)">
    <animate attributeName="cx" values="40;960;40" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".2;1;.2" dur="9s" repeatCount="indefinite"/>
  </circle>
</svg>
